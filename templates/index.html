<!DOCTYPE html>
<html>
<head>
    <title>Face Emotion Detector</title>
</head>
<body>
    <h1>Face Emotion Detector</h1>
    <form action="/submit" method="post" enctype="multipart/form-data">
        <p>
            <label>Name:</label><br>
            <input type="text" name="name" required>
        </p>
        <p>
            <label>Student ID:</label><br>
            <input type="text" name="student_id" required>
        </p>
        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </p>
        <p>
            <label>Upload Photo:</label><br>
            <input type="file" name="photo" accept="image/*" required>
        </p>
        <p>
            <input type="submit" value="Detect Emotion">
        </p>
    </form>
   
    <div id="result">
        <h2>Prediction result</h2>
        <p><strong>{{ message }}</strong></p>
        <p>Predicted emotion: <em>{{ emotion }}</em></p>
        {% if filename %}
        <p>Uploaded image:</p>
        <img src="{{ url_for('uploaded_file', filename=filename) }}" alt="uploaded image" style="max-width:300px;">
        {% endif %}
    </div>
    
</body>
</html>
